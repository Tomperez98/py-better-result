[project]
name = "better-result"
version = "0.1.0"
description = "Typed Result values, tagged errors, retries, and codecs for Python"
readme = "README.md"
authors = [
    { name = "Tomperez98", email = "tomasperezalvarez@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "ruff>=0.16.6,<0.17",
    "ty>=0.0.78,<0.1",
]

[tool.ty]

[tool.ty.rules]
all = "error"

[tool.pytest.ini_options]
asyncio_mode = "auto"
