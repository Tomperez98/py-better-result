name: CI / CD

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
    paths-ignore:
      - README.md

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: 0.11.21

      - name: check the lockfile is up to date
        run: uv lock --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: 0.11.21

      - name: set up python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: install
        run: uv sync --locked --all-packages

      - name: run tests with coverage
        run: uv run pytest -q --cov

      - name: check linting
        run: uv run ruff check

      - name: check types
        run: uv run ty check

      - name: run examples
        run: uv run better-result-example --all

  build:
    needs: [lockfile, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: 0.11.21

      - name: set up python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: verify tag matches pyproject version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          tag="${RELEASE_TAG#v}"
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$tag" = "$version" || {
            echo "tag '$RELEASE_TAG' does not match pyproject.toml version '$version'" >&2
            exit 1
          }

      - name: build sdist and wheel
        run: uv build --clear --no-create-gitignore

      - name: upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: 0.11.21
          enable-cache: false
          ignore-empty-workdir: true

      - name: download distributions
        uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/

      # Configure this repository as a trusted publisher for the
      # py-better-result project on PyPI.
      - name: publish to PyPI
        run: uv publish --trusted-publishing always
