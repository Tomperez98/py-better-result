[project]
name = "better-result-example"
version = "0.1.0"
description = "Click runner for py-better-result examples"
requires-python = ">=3.13"
dependencies = [
  "click>=8.1,<9",
  "py-better-result",
]

[project.scripts]
better-result-example = "better_result_example.cli:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
py-better-result = { workspace = true }
